<!DOCTYPE html>
<html>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:40px">
  <h2>Deploy AcePredictionMarket (Base Sepolia)</h2>
  <textarea id="data" rows="6" cols="80" placeholder="Cole aqui (Ctrl+V) o Call data copiado do Remix"></textarea><br><br>
  <button onclick="deploy()" style="padding:14px 24px;font-size:16px;cursor:pointer;background:#0052ff;color:#fff;border:none;border-radius:8px">
    Conectar Rabby e Criar Contrato
  </button>
  <pre id="out" style="margin-top:20px;color:#4ade80;font-size:14px"></pre>
  <script>
    async function deploy() {
      try {
        const [from] = await window.ethereum.request({ method: 'eth_requestAccounts' });
        let data = document.getElementById('data').value.trim();
        if (!data.startsWith('0x')) data = '0x' + data;
        const txHash = await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{ from, data }]
        });
        document.getElementById('out').innerText =
          'Contrato enviado!\nAbra este link para copiar o endereço 0x... do contrato:\nhttps://basescan.org' + txHash;
      } catch (e) {
        document.getElementById('out').innerText = 'Erro: ' + e.message;
      }
    }
  </script>
</body>
</html>
